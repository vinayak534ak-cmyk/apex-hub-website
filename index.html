<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BATTLE OP - Free Fire Tournament</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --primary-dark: #1a0b2e;
            --primary-purple: #6b21a8;
            --secondary-purple: #a855f7;
            --accent-pink: #d946ef;
            --light-purple: #c084fc;
            --gold: #fbbf24;
            --green: #22c55e;
            --red: #ef4444;
            --glass: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.15);
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #1a0b2e 0%, #2d1b4e 40%, #7c3aed 70%, #c026d3 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        
        .app-container {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px;
        }
        
        .screen {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .screen.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px;
        }
        
        .login-logo {
            width: 140px;
            height: 140px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .login-logo::before {
            content: "\1F464";
            font-size: 80px;
            display: block;
            text-align: center;
            filter: drop-shadow(0 0 20px rgba(217,70,239,0.5));
        }
        
        .login-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .login-subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.5;
        }
        
        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }
        
        .input-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 500;
            color: rgba(255,255,255,0.9);
        }
        
        .input-field {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: all 0.3s;
        }
        
        .input-field::placeholder {
            color: rgba(255,255,255,0.4);
        }
        
        .input-field:focus {
            border-color: var(--accent-pink);
            background: rgba(255,255,255,0.15);
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper .input-field {
            padding-right: 50px;
        }
        
        .eye-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 18px;
        }
        
        .forgot-password {
            align-self: flex-end;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            text-decoration: none;
            margin-top: -10px;
            margin-bottom: 24px;
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            background: linear-gradient(135deg, var(--primary-purple), var(--accent-pink));
            color: white;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(107,33,168,0.4);
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .signup-link {
            margin-top: 24px;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }
        
        .signup-link a {
            color: white;
            font-weight: 700;
            text-decoration: none;
        }
        
        .signup-screen {
            min-height: 100vh;
            padding: 20px 24px 40px;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        .signup-title {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .signup-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 30px;
        }
        
        .refer-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .refer-row .input-group {
            flex: 1;
        }
        
        .btn-verify {
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1e3a5f, #2563eb);
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            white-space: nowrap;
        }
        
        .home-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(26,11,46,0.9) 0%, transparent 100%);
        }
        
        .app-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .coin-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }
        
        .coin-icon {
            color: var(--gold);
            font-size: 16px;
        }
        
        .notif-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            position: relative;
        }
        
        .notif-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            background: var(--accent-pink);
            border-radius: 50%;
        }
        
        .carousel {
            margin: 0 16px 24px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            height: 180px;
        }
        
        .carousel-slide {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(107,33,168,0.5)), url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180"><rect fill="%231a0b2e" width="400" height="180"/><text x="200" y="60" text-anchor="middle" fill="%23fbbf24" font-size="18" font-weight="bold">SPECIAL NEW PLAYERS</text><text x="200" y="90" text-anchor="middle" fill="white" font-size="14">How to join Free Fire Match</text><circle cx="200" cy="130" r="25" fill="none" stroke="%23ef4444" stroke-width="3"/><polygon points="190,120 190,140 210,130" fill="%23ef4444"/></svg>');
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .carousel-title {
            color: var(--gold);
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        
        .carousel-subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 12px;
        }
        
        .carousel-btn {
            background: linear-gradient(90deg, #dc2626, #ef4444);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
        }
        .dot.active {
            background: white;
            width: 20px;
            border-radius: 4px;
        }
        
        .section-title {
            font-size: 22px;
            font-weight: 800;
            margin: 0 20px 16px;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 16px;
            margin-bottom: 24px;
        }
        
        .game-card {
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
            border: 2px solid rgba(255,255,255,0.1);
        }
        
        .game-card:active {
            transform: scale(0.95);
        }
        
        .game-card-bg {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-purple), var(--accent-pink));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
        }
        
        .game-card:nth-child(1) .game-card-bg { background: linear-gradient(135deg, #7c2d12, #dc2626); }
        .game-card:nth-child(2) .game-card-bg { background: linear-gradient(135deg, #065f46, #10b981); }
        .game-card:nth-child(3) .game-card-bg { background: linear-gradient(135deg, #7c3aed, #c026d3); }
        .game-card:nth-child(4) .game-card-bg { background: linear-gradient(135deg, #1e3a5f, #3b82f6); }
        .game-card:nth-child(5) .game-card-bg { background: linear-gradient(135deg, #854d0e, #eab308); }
        .game-card:nth-child(6) .game-card-bg { background: linear-gradient(135deg, #701a75, #d946ef); }
        .game-card:nth-child(7) .game-card-bg { background: linear-gradient(135deg, #14532d, #22c55e); }
        .game-card:nth-child(8) .game-card-bg { background: linear-gradient(135deg, #7c2d12, #f97316); }
        .game-card:nth-child(9) .game-card-bg { background: linear-gradient(135deg, #312e81, #6366f1); }
        .game-card:nth-child(10) .game-card-bg { background: linear-gradient(135deg, #881337, #f43f5e); }
        .game-card:nth-child(11) .game-card-bg { background: linear-gradient(135deg, #164e63, #06b6d4); }
        .game-card:nth-child(12) .game-card-bg { background: linear-gradient(135deg, #3f6212, #84cc16); }
        
        .game-icon {
            font-size: 32px;
            margin-bottom: 4px;
        }
        
        .game-name {
            font-size: 10px;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
        }
        
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(26,11,46,0.95) 0%, transparent 100%);
        }
        
        .page-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        
        .tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 20px 20px;
            background: rgba(255,255,255,0.08);
            border-radius: 50px;
            padding: 4px;
        }
        
        .tab {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 50px;
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, var(--primary-purple), var(--accent-pink));
            color: white;
        }
        
        .match-card {
            margin: 0 16px 16px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
        }
        
        .match-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .match-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--gold), #f59e0b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        
        .match-info {
            flex: 1;
        }
        
        .match-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        
        .match-time {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }
        
        .view-link {
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
        }
        
        .match-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .stat-value {
            font-size: 16px;
            font-weight: 800;
        }
        
        .match-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .detail-box {
            text-align: center;
        }
        
        .detail-label {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.08);
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        
        .detail-value {
            font-size: 14px;
            font-weight: 700;
        }
        
        .match-footer {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .progress-bar {
            flex: 1;
            height: 32px;
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-purple), var(--secondary-purple));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            transition: width 0.5s ease;
        }
        
        .btn-join {
            padding: 10px 24px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #1e3a5f, #2563eb);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-join:active {
            transform: scale(0.95);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: linear-gradient(180deg, #4c1d95, #2d1b4e);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.15);
        }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

            border-radius: 50%;
